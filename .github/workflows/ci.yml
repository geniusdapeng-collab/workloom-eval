name: WorkLoom Eval CI
on:
  push:
    branches: [main, "task/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile
      - name: Install isolated browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Source and credential checks
        run: pnpm check
      - name: Contract, persistence, permissions and review regressions
        run: pnpm test
      - name: Production frontend build
        run: pnpm build
